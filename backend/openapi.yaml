openapi: 3.1.0
info:
  title: LaPlacita API
  description: |
    API principal de LaPlacita — plataforma de pre-pedidos y recolección (Click & Collect).
    Sistema de monolito modular con 5 dominios: Catálogo, Pedidos, Pagos, Entrega y Notificaciones.
    Cada módulo opera en el contexto de una tienda (`tiendaId`) garantizando aislamiento estricto.
  version: v1
  contact:
    name: Equipo LaPlacita
  license:
    name: Propietario

servers:
  - url: /api/v1
    description: Servidor local de desarrollo (Next.js App Router)

tags:
  - name: health
    description: Estado de salud del backend
  - name: catalogo
    description: Catálogo de productos por tienda
  - name: pedidos
    description: Ciclo de vida del pedido
  - name: pagos
    description: Confirmación de pagos
  - name: entrega
    description: Validación de entrega por PIN
  - name: notificaciones
    description: Notificaciones de cambio de estado
  - name: identidad
    description: Cuentas e inicio de sesión (ADR-0021)

paths:
  /auth/registro:
    post:
      tags: [identidad]
      summary: Crear una cuenta de la comunidad (correo institucional) y abrir sesión
      operationId: registrar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada; incluye el token de sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '400':
          description: Datos inválidos (correo de otro dominio, contraseña corta…)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/sesion:
    post:
      tags: [identidad]
      summary: Iniciar sesión con correo y contraseña
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionRequest'
      responses:
        '200':
          description: Sesión abierta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sesion'
        '401':
          description: Correo o contraseña incorrectos (mismo mensaje en ambos casos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiados intentos fallidos (5 en 15 minutos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/yo:
    get:
      tags: [identidad]
      summary: Datos de la cuenta de la sesión actual
      operationId: obtenerCuenta
      security:
        - sesion: []
      responses:
        '200':
          description: Cuenta autenticada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Sin sesión o token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /health:
    get:
      tags: [health]
      summary: Estado de salud del backend
      operationId: getHealth
      responses:
        '200':
          description: Backend operativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /metricas:
    get:
      tags: [health]
      summary: Métricas de operación asociadas a los escenarios (ESC-01, ESC-03, ESC-04)
      operationId: obtenerMetricas
      responses:
        '200':
          description: Contadores en memoria del proceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metricas'

  /catalogo/productos/{productoId}:
    get:
      tags: [catalogo]
      summary: Obtener un producto por su ID y tienda
      operationId: obtenerProducto
      parameters:
        - name: productoId
          in: path
          required: true
          schema:
            type: string
          description: ID del producto
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
          description: ID de la tienda propietaria
      responses:
        '200':
          description: Producto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producto'
        '404':
          description: Producto no encontrado o no pertenece a la tienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Producto no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /catalogo/tiendas/{tiendaId}/productos:
    get:
      tags: [catalogo]
      summary: Listar productos de una tienda
      operationId: listarProductosPorTienda
      parameters:
        - name: tiendaId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de productos de la tienda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producto'

  /pedidos:
    post:
      tags: [pedidos]
      summary: Crear un nuevo pedido
      operationId: crearPedido
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Clave única por intento lógico de compra. Un reintento con la misma clave y el mismo contenido devuelve el pedido original (S11, F-01/F-02).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearPedidoRequest'
      responses:
        '201':
          description: Pedido creado en estado Recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

        '409':
          description: Idempotency-Key reutilizada con otro contenido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags: [pedidos]
      summary: Pedidos de la cuenta autenticada, en todas las tiendas (sin PIN)
      operationId: listarMisPedidos
      security:
        - sesion: []
      responses:
        '200':
          description: Pedidos del usuario, del más reciente al más antiguo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pedido'
        '401':
          description: Sin sesión o token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pedidos/{pedidoId}:
    get:
      tags: [pedidos]
      summary: Obtener un pedido por ID y tienda
      operationId: obtenerPedido
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          description: Pedido no encontrado en la tienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pedidos/{pedidoId}/pin:
    get:
      tags: [pedidos]
      summary: PIN de retiro, solo para el dueño del pedido y con el pedido en Listo
      description: >-
        ADR-0022. Única lectura que devuelve el PIN y exige sesión. La vista
        pública del pedido (GET /pedidos/{pedidoId}) sigue sin PIN (ADR-0013).
        Un pedido ajeno o inexistente responde igual (404) para no revelar
        pedidos de otras cuentas.
      operationId: obtenerPinDelDueno
      security:
        - sesion: []
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PIN del pedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PinPedido'
        '401':
          description: Sin sesión o token inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: El pedido no existe o no es de esta cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El pedido todavía no está Listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /pagos/{pedidoId}/confirmar:
    post:
      tags: [pagos]
      summary: Confirmar pago de un pedido
      operationId: confirmarPago
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pago confirmado, pedido en En preparación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: Pedido no está en estado Recibido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido no encontrado en la tienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /entrega/{pedidoId}/listo:
    post:
      tags: [entrega]
      summary: Marcar pedido como listo y generar PIN
      operationId: marcarListo
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Pedido listo con PIN generado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoConPin'
        '404':
          description: Pedido no encontrado en la tienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /entrega/{pedidoId}/validar:
    post:
      tags: [entrega]
      summary: Validar PIN de entrega
      operationId: validarPin
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidarPinRequest'
      responses:
        '200':
          description: PIN válido, pedido entregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          description: PIN incorrecto, pedido bloqueado por exceso de intentos (A-06) o pedido no está Listo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido no encontrado en la tienda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notificaciones:
    post:
      tags: [notificaciones]
      summary: Notificar cambio de estado de un pedido
      operationId: notificarCambioEstado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificarCambioEstadoRequest'
      responses:
        '201':
          description: Notificación generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'

  /notificaciones/{pedidoId}:
    get:
      tags: [notificaciones]
      summary: Obtener notificaciones de un pedido por tienda
      operationId: obtenerNotificaciones
      parameters:
        - name: pedidoId
          in: path
          required: true
          schema:
            type: string
        - name: tiendaId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lista de notificaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notificacion'

components:
  securitySchemes:
    sesion:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Token de sesión de POST /auth/sesion o /auth/registro (ADR-0021). En la
        app web lo agrega el BFF del frontend desde una cookie httpOnly.

  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required:
        - status

    Metricas:
      type: object
      properties:
        pedidosCreados:
          type: integer
          minimum: 0
          description: Total de pedidos creados (ESC-01)
        pagosConfirmados:
          type: integer
          minimum: 0
          description: Transiciones a En preparación (ESC-04)
        pedidosListos:
          type: integer
          minimum: 0
          description: Transiciones a Listo (ESC-03)
        entregasValidadas:
          type: integer
          minimum: 0
          description: Transiciones a Entregado con PIN válido (ESC-03)
        pinesRechazados:
          type: integer
          minimum: 0
          description: Intentos con PIN incorrecto (ESC-03, A-06)
        pinesBloqueados:
          type: integer
          minimum: 0
          description: Intentos sobre pedidos bloqueados tras 5 fallos (ESC-03, A-06)
      required:
        - pedidosCreados
        - pagosConfirmados
        - pedidosListos
        - entregasValidadas
        - pinesRechazados
        - pinesBloqueados

    Producto:
      type: object
      properties:
        id:
          type: string
        tiendaId:
          type: string
        nombre:
          type: string
        precio:
          type: number
          minimum: 0
        disponible:
          type: boolean
      required:
        - id
        - tiendaId
        - nombre
        - precio
        - disponible

    Pedido:
      type: object
      description: >-
        Vista pública del pedido. NO incluye `pin`: la lectura de un pedido no
        debe permitir obtener el PIN de validación del punto de recolección
        (A-06, ESC-03). S9 / ADR-0013.
      properties:
        id:
          type: string
        codigo:
          type: [string, 'null']
          pattern: '^[A-HJ-NP-Z][0-9]{2}$'
          example: A07
          description: >-
            Código corto para reconocer el pedido en el mostrador (A01 … Z99,
            sin las letras I y O, que se confunden con 1 y 0).
            Por tienda, se reinicia cada día (hora de Colombia) y no se repite
            entre pedidos no entregados. No reemplaza a `id`. Null en pedidos
            creados antes de existir el campo.
        creadoEn:
          type: [string, 'null']
          format: date-time
          description: Momento de creación del pedido (null en pedidos anteriores al campo).
        clienteId:
          type: string
        tiendaId:
          type: string
        productoId:
          type: string
        cantidad:
          type: integer
          minimum: 1
        total:
          type: number
          minimum: 0
        estado:
          type: string
          enum: [Recibido, En preparación, Listo, Entregado]
      required:
        - id
        - clienteId
        - tiendaId
        - productoId
        - cantidad
        - total
        - estado

    PedidoConPin:
      type: object
      description: >-
        Pedido con su PIN de validación. Solo lo devuelve
        `POST /entrega/{pedidoId}/listo`, porque el mostrador necesita el PIN
        para entregar. Cualquier otro endpoint que exponga el PIN por lectura
        anula A-06. S9 / ADR-0013.
      allOf:
        - $ref: '#/components/schemas/Pedido'
        - type: object
          properties:
            pin:
              type: string
              nullable: true
              minLength: 4
              maxLength: 4
          required:
            - pin

    CrearPedidoRequest:
      type: object
      properties:
        productoId:
          type: string
        cantidad:
          type: integer
          minimum: 1
        clienteId:
          type: string
        tiendaId:
          type: string
      required:
        - productoId
        - cantidad
        - clienteId
        - tiendaId

    ValidarPinRequest:
      type: object
      properties:
        pinIngresado:
          type: string
          minLength: 4
          maxLength: 4
      required:
        - pinIngresado

    NotificarCambioEstadoRequest:
      type: object
      properties:
        pedidoId:
          type: string
        estado:
          type: string
          enum: [Recibido, En preparación, Listo, Entregado]
        tiendaId:
          type: string
      required:
        - pedidoId
        - estado
        - tiendaId

    Notificacion:
      type: object
      properties:
        pedidoId:
          type: string
        tiendaId:
          type: string
        estado:
          type: string
        mensaje:
          type: string
        enviadaEn:
          type: string
          format: date-time
      required:
        - pedidoId
        - tiendaId
        - estado
        - mensaje
        - enviadaEn

    Usuario:
      type: object
      description: Cuenta sin datos sensibles (nunca incluye el hash de la contraseña).
      properties:
        id:
          type: string
        correo:
          type: string
          format: email
        nombre:
          type: string
        rol:
          type: string
          enum: [cliente, trabajador, admin]
        tiendaId:
          type: [string, 'null']
      required: [id, correo, nombre, rol]

    RegistroRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
          description: Correo institucional (por defecto @utb.edu.co)
        nombre:
          type: string
          minLength: 2
          maxLength: 60
        contrasena:
          type: string
          minLength: 8
          maxLength: 128
      required: [correo, nombre, contrasena]

    SesionRequest:
      type: object
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
      required: [correo, contrasena]

    Sesion:
      type: object
      properties:
        token:
          type: string
          description: JWT HS256, vence a los 7 días
        usuario:
          $ref: '#/components/schemas/Usuario'
      required: [token, usuario]

    PinPedido:
      type: object
      description: PIN de retiro para el dueño del pedido (ADR-0022).
      properties:
        pedidoId:
          type: string
        tiendaId:
          type: string
        codigo:
          type: [string, 'null']
        pin:
          type: string
          pattern: '^[0-9]{4}$'
      required: [pedidoId, tiendaId, pin]

    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
