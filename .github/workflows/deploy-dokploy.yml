name: Deploy Dokploy (laboratorio de la U)

# Despliegue del backend en Dokploy — el servidor del laboratorio de la
# universidad (ADR-0018: retiro de Azure). El app de Dokploy observa la rama
# `master`; este workflow valida en un gate (pruebas con PostgreSQL + contrato)
# y dispara el webhook de redeploy. La PWA del frontend vive en la misma
# plataforma (app separada que observa master).

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-dokploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-dokploy-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://laplacita:laplacita_ci@localhost:5432/laplacita

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
            POSTGRES_USER: laplacita
            POSTGRES_PASSWORD: laplacita_ci
            POSTGRES_DB: laplacita
        ports:
            - 5432:5432
        options: >-
            --health-cmd pg_isready
            --health-interval 5s
            --health-timeout 5s
            --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci
        working-directory: backend

      - name: Gate — pruebas con base de datos real
        run: npm test
        working-directory: backend

      - name: Gate — prueba de contrato
        run: npm run contract-test
        working-directory: backend

      # Dokploy solo despliega si el webhook dice la rama como un push de GitHub
      # (cabecera X-GitHub-Event y `ref` en el cuerpo). Sin eso responde 301
      # «Branch Not Match» sin desplegar, y curl -f no falla con un 3xx: el paso
      # salía en verde y el health check validaba la versión anterior. Por eso
      # aquí se exige un 200.
      - name: Redesplegar en Dokploy
        run: |
          echo "Disparando redeploy del backend ($GITHUB_SHA) en el laboratorio de la U..."
          cuerpo=$(printf '{"ref":"refs/heads/master","after":"%s","head_commit":{"id":"%s","message":"CI %s"}}' "$GITHUB_SHA" "$GITHUB_SHA" "$GITHUB_SHA")
          codigo=$(curl -sS --max-time 30 -o respuesta.txt -w '%{http_code}' -X POST             -H 'Content-Type: application/json' -H 'X-GitHub-Event: push'             -d "$cuerpo" "$DOKPLOY_TEST_WEBHOOK")
          echo "Dokploy respondió $codigo: $(cat respuesta.txt)"
          test "$codigo" = "200"
        env:
          DOKPLOY_TEST_WEBHOOK: ${{ secrets.DOKPLOY_TEST_WEBHOOK }}

      - name: Health check
        run: |
          base="${{ secrets.DOKPLOY_TEST_URL }}"
          echo "Verificando $base/api/v1/health"
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$base/api/v1/health" || true)
            if [ "$code" = "200" ]; then echo "health=200 (intento $i)"; exit 0; fi
            echo "intento $i: http=$code"; sleep 10
          done
          echo "health check agotado: la app del laboratorio no responde tras el redeploy"
          exit 1
