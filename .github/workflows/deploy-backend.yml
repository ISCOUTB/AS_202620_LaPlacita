# Despliegue reproducible a Azure Container Apps (precisa ADR-0009 sin editarlo).
# Azure for Students no permite ACR Tasks (TasksOperationsNotAllowed), por lo que la
# imagen se construye en el runner y se empuja al ACR. Autenticación OIDC federada
# (sin secrets de password). El `containerapp update --image` conserva DATABASE_URL
# y HOSTNAME, que viven como secretos/env del Container App, nunca en este repo.

name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: laplacitaacr
  IMAGE_NAME: laplacita-app
  APP_NAME: laplacita-app
  RESOURCE_GROUP: rg-laplacita

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login al registro
        run: az acr login --name $ACR_NAME

      - name: Build y push de la imagen
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            backend
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Desplegar en Container Apps
        run: |
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://laplacita-app.graymoss-fdd72159.canadacentral.azurecontainerapps.io/api/v1/health || true)
            if [ "$code" = "200" ]; then echo "health=200 (intento $i)"; exit 0; fi
            echo "intento $i: http=$code"; sleep 10
          done
          echo "health check agotado: la revision nueva no responde"
          exit 1
