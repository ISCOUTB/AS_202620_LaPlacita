name: Deploy backend

# Despliegue reproducible a Azure Container Apps (precisa ADR-0009 sin editarlo).
# Azure for Students no permite ACR Tasks (TasksOperationsNotAllowed), por lo que
# la imagen se construye en el runner y se empuja al ACR con az acr login.
# La autenticación es OIDC federada (sin secretos de password): el app registration
# de Azure trae la credencial federada del repo y los tres IDs viven como secrets.
# DATABASE_URL y HOSTNAME viven como secretos/env del Container App y este update
# delimitado a --image los conserva.

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login al registro
        run: az acr login --name laplacitaacr

      - name: Build y push de la imagen
        run: |
          docker build \
            -f backend/Dockerfile \
            -t laplacitaacr.azurecr.io/laplacita-app:${{ github.sha }} \
            backend
          docker push laplacitaacr.azurecr.io/laplacita-app:${{ github.sha }}

      - name: Desplegar en Container Apps
        run: |
          az containerapp update \
            --name laplacita-app \
            --resource-group rg-laplacita \
            --image laplacitaacr.azurecr.io/laplacita-app:${{ github.sha }}

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              https://laplacita-app.graymoss-fdd72159.canadacentral.azurecontainerapps.io/api/v1/health || true)
            if [ "$code" = "200" ]; then echo "health=200 (intento $i)"; exit 0; fi
            echo "intento $i: http=$code"; sleep 10
          done
          echo "health check agotado: la revision nueva no responde"
          exit 1
