name: Deploy backend

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: laplacitaacr
  IMAGE_NAME: laplacita-app
  APP_NAME: laplacita-app
  RESOURCE_GROUP: rg-laplacita

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login al registro
        run: az acr login --name $ACR_NAME

      - name: Build y push de la imagen
        run: |
          docker build \
            -f backend/Dockerfile \
            -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} \
            backend
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Desplegar en Container Apps
        run: |
          az containerapp update \
            --name $APP_NAME \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}
