name: CI LaPlacita

on: 
    push:
        branches:
            - master 
    pull_request:
        branches:
            - master

jobs:
    test:
        runs-on: ubuntu-latest

        # ESC-01 · ADR-0014: la prueba de supervivencia ante reinicio necesita
        # una base real; el servicio vive solo en el job de CI y desaparece con él.
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: laplacita
                    POSTGRES_PASSWORD: laplacita_ci
                    POSTGRES_DB: laplacita
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://laplacita:laplacita_ci@localhost:5432/laplacita

        steps:
        - name: Descargar código
          uses: actions/checkout@v4
        
        - name: Configurar Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'

        - name: Instalar dependencias
          run: npm ci

        - name: Ejecutar pruebas
          run: npm test

    contract-test:
        runs-on: ubuntu-latest
        needs: test

        steps:
        - name: Descargar código
          uses: actions/checkout@v4

        - name: Configurar Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'

        - name: Instalar dependencias
          run: npm ci

        - name: Ejecutar pruebas de contrato
          run: node --test tests/contract-openapi.test.js

    sonar:
        runs-on: ubuntu-latest
        needs: [test, contract-test]
        env:
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            # Las pruebas de persistencia (ESC-01, ADR-0014) necesitan base
            # real para contar cobertura del código nuevo en el análisis.
            DATABASE_URL: postgresql://laplacita:laplacita_ci@localhost:5432/laplacita_ci
        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: laplacita
                    POSTGRES_PASSWORD: laplacita_ci
                    POSTGRES_DB: laplacita_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        steps:
        - name: Descargar código (historial completo)
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Configurar Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'

        - name: Instalar dependencias
          run: npm ci

        - name: Ejecutar pruebas con cobertura
          run: node --test --experimental-test-coverage --test-reporter=spec --test-reporter-destination=stdout --test-reporter=lcov --test-reporter-destination=lcov.info "tests/**/*.test.js"

        - name: Análisis estático con SonarCloud
          if: ${{ env.SONAR_TOKEN != '' }}
          uses: sonarsource/sonarcloud-github-action@v5
          env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        